<!-- Baselines — the master table.
     PCAF sets the method; it does not set a country's baseline. This screen is
     where the regional judgement lives: what is in force, who released it, what
     it replaced and why. Everything the product screens against resolves from
     here, so no two screens can hold a different figure for the same question.

     Copy rule for this page, as for every other: state what the figure is,
     cite the standard that governs it, and stop. -->

<style>
  /* Tokens first, so all three theme states resolve as a set: bare :root is
     the complete light palette, the media query covers the un-stamped system
     default, and [data-theme] lets an explicit choice win in both directions. */
  .bl {
    --bl-ink: #14202e;
    --bl-muted: #5b6b7c;
    --bl-line: #dde4ec;
    --bl-surface: #ffffff;
    --bl-sunk: #f4f7fa;
    --bl-accent: #1e4d78;
    --bl-accent-soft: #dceafa;
    --bl-live: #15803d;
    --bl-live-soft: #dcfce7;
    --bl-draft: #b45309;
    --bl-draft-soft: #fef3c7;
    --bl-past: #6b7a8a;
    --bl-past-soft: #eef2f6;
    color: var(--bl-ink);
    min-width: 0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .bl {
      --bl-ink: #e6edf5; --bl-muted: #93a3b5; --bl-line: #2c3a4b;
      --bl-surface: #16212e; --bl-sunk: #0e1721;
      --bl-accent: #7cb2e8; --bl-accent-soft: #14324f;
      --bl-live: #86efac; --bl-live-soft: #0d2f1a;
      --bl-draft: #fbbf24; --bl-draft-soft: #3d2606;
      --bl-past: #94a3b8; --bl-past-soft: #1c2836;
    }
  }
  :root[data-theme="dark"] .bl {
    --bl-ink: #e6edf5; --bl-muted: #93a3b5; --bl-line: #2c3a4b;
    --bl-surface: #16212e; --bl-sunk: #0e1721;
    --bl-accent: #7cb2e8; --bl-accent-soft: #14324f;
    --bl-live: #86efac; --bl-live-soft: #0d2f1a;
    --bl-draft: #fbbf24; --bl-draft-soft: #3d2606;
    --bl-past: #94a3b8; --bl-past-soft: #1c2836;
  }

  .bl-band { display: grid; gap: 14px; margin-bottom: 22px; }
  .bl-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }

  .bl-card {
    background: var(--bl-surface); border: 1px solid var(--bl-line);
    border-radius: 10px; padding: 16px 18px; min-width: 0;
  }
  .bl-h { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--bl-muted); margin: 0 0 10px; }
  .bl-metric { font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  .bl-values { display: flex; flex-wrap: wrap; gap: 14px; align-items: baseline; margin-bottom: 8px; }
  .bl-v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .bl-u { font-size: 12px; color: var(--bl-muted); }
  .bl-basis { font-size: 12px; color: var(--bl-muted); line-height: 1.5; }
  .bl-src { font-size: 11.5px; color: var(--bl-muted); line-height: 1.55; margin-top: 8px; }

  .bl-pill {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 600; letter-spacing: .02em; white-space: nowrap;
  }
  .bl-pill.live  { background: var(--bl-live-soft);  color: var(--bl-live); }
  .bl-pill.draft { background: var(--bl-draft-soft); color: var(--bl-draft); }
  .bl-pill.past  { background: var(--bl-past-soft);  color: var(--bl-past); }
  .bl-pill.prov  { background: var(--bl-past-soft);  color: var(--bl-past); }

  /* The pledge bar. `display: block` because an inline element takes no
     height and would render as nothing, which reads as a score of zero. */
  .bl-track { height: 8px; border-radius: 999px; background: var(--bl-sunk); overflow: hidden; margin: 10px 0 6px; }
  .bl-fill { display: block; height: 100%; background: var(--bl-accent); border-radius: 999px; }

  .bl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .bl-table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 780px; }
  .bl-table th {
    text-align: left; font-weight: 600; color: var(--bl-muted);
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    padding: 8px 10px; border-bottom: 1px solid var(--bl-line); white-space: nowrap;
  }
  .bl-table td { padding: 9px 10px; border-bottom: 1px solid var(--bl-line); vertical-align: top; }
  .bl-table td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bl-table tr.past td { color: var(--bl-muted); }

  .bl-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .bl-actions select, .bl-actions input { min-width: 0; }
  .bl-btn {
    font: inherit; font-size: 12.5px; padding: 6px 12px; border-radius: 7px;
    border: 1px solid var(--bl-line); background: var(--bl-surface); color: var(--bl-ink); cursor: pointer;
  }
  .bl-btn.primary { background: var(--bl-accent); border-color: var(--bl-accent); color: #fff; }
  .bl-btn:disabled { opacity: .5; cursor: not-allowed; }
  .bl-form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); }
  .bl-form label { display: grid; gap: 4px; font-size: 11.5px; color: var(--bl-muted); min-width: 0; }
  .bl-form input, .bl-form select {
    font: inherit; font-size: 13px; padding: 7px 9px; min-width: 0;
    border: 1px solid var(--bl-line); border-radius: 7px;
    background: var(--bl-sunk); color: var(--bl-ink);
  }
  .bl-msg { font-size: 12.5px; margin-top: 10px; line-height: 1.5; }
  .bl-msg.bad { color: var(--bl-draft); }
  .bl-empty { font-size: 13px; color: var(--bl-muted); padding: 14px 0; }
</style>

<div class="bl">
  <section class="bl-band">
    <div>
      <h3 class="bl-h">In force for this organisation</h3>
      <div class="bl-grid" id="bl-effective"></div>
    </div>
  </section>

  <section class="bl-band">
    <div class="bl-card">
      <h3 class="bl-h">Pledge</h3>
      <div id="bl-pledge"></div>
    </div>
  </section>

  <section class="bl-band">
    <div class="bl-card">
      <h3 class="bl-h">Master table</h3>
      <div class="bl-scroll">
        <table class="bl-table">
          <thead>
            <tr>
              <th>Metric</th><th>Scope</th><th>Country</th>
              <th class="num">Values</th><th class="num">Version</th>
              <th>Status</th><th>Movement</th><th>Source</th><th></th>
            </tr>
          </thead>
          <tbody id="bl-rows"></tbody>
        </table>
      </div>
      <div class="bl-empty" id="bl-empty" hidden>No baseline has been recorded. The shipped values are in force and are marked illustrative.</div>
    </div>
  </section>

  <section class="bl-band">
    <div class="bl-card">
      <h3 class="bl-h">Record a baseline</h3>
      <div class="bl-form">
        <label>Metric
          <select id="bl-metric"></select>
        </label>
        <label>Scope
          <select id="bl-scope">
            <option value="country">Country</option>
            <option value="organisation">This organisation</option>
            <option value="global">Global</option>
          </select>
        </label>
        <label>Country
          <input id="bl-country" value="LK" maxlength="2" />
        </label>
        <label>Green threshold
          <input id="bl-green" type="number" step="1" min="0" value="520" />
        </label>
        <label>Transition threshold
          <input id="bl-transition" type="number" step="1" min="0" value="780" />
        </label>
        <label>Source
          <input id="bl-source" placeholder="The document this figure rests on" />
        </label>
      </div>
      <div class="bl-actions">
        <button class="bl-btn primary" id="bl-create">Save as draft</button>
        <span class="bl-basis">A draft is not in force until it is released.</span>
      </div>
      <div class="bl-msg" id="bl-msg" hidden></div>
    </div>
  </section>
</div>
