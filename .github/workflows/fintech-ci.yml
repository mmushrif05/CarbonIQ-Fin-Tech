# CarbonIQ FinTech — CI
#
# Every push and pull request: the suite on the memory store (two Node
# versions), the same suite on PostgreSQL, lint, the type check, the
# dependency audit at the high level, and the built frontend driven in a
# browser. `gate` needs all of them; it is the one status a branch
# protection rule on `main` should require (docs/ENVIRONMENTS.md).

name: FinTech CI

on:
  push:
    branches: [main, staging, 'claude/**']
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Test (memory store, with coverage thresholds)
        run: npm test
        env:
          NODE_ENV: test

  # The same suite against PostgreSQL. Every test that touches storage runs
  # on the relational store here, so a change that only works on the
  # in-memory fallback cannot pass.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carboniq
          POSTGRES_PASSWORD: carboniq
          POSTGRES_DB: carboniq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U carboniq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://carboniq:carboniq@localhost:5432/carboniq_test
      - name: Test against PostgreSQL
        # Every suite, on the real store: the fifteen that pinned themselves to
        # memory at module scope are gone, so this is the same suites the
        # in-memory job runs.
        run: npx jest --coverage
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://carboniq:carboniq@localhost:5432/carboniq_test
      - name: Scale — the 10,000-row roll-up under a second, measured alone
        run: npx jest --runInBand tests/pg-scale.test.js
        env:
          NODE_ENV: test
          SCALE_STRICT: '1'
          TEST_DATABASE_URL: postgresql://carboniq:carboniq@localhost:5432/carboniq_test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check (every file carrying @ts-check)
        run: npm run typecheck

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit — a high or critical finding fails the build
        run: npm audit --audit-level=high

  # The built frontend, driven in a browser against the memory store.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npx playwright test
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # The conformance matrices, re-proved rather than re-read. The committed
  # docs/CONFORMANCE-EVIDENCE.md says the cited test executes the cited code;
  # this regenerates it and fails if the working tree disagrees, because a
  # conformance document regenerated from a stale checkout reads as current.
  conformance-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prove every cited rule by running its own test
        run: npm run docs:conformance-evidence
        env:
          NODE_ENV: test
      - name: The committed evidence matches what the run produced
        run: git diff --exit-code -- docs/CONFORMANCE-EVIDENCE.md

  # The generated documentation. A code tour whose diagram is a month old, or a
  # README naming routes that 404, is worse than none: it reads as current.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate everything that is generated
        run: |
          npm run docs:openapi
          npm run docs:scopes
          npm run docs:readme
          npm run docs:code-tour
          npm run docs:factor-manifest
          npm run docs:parta-manifest
          npm run docs:parta-conformance
          npm run docs:typecheck-worklist
      - name: The committed documents match what the code produces
        run: git diff --exit-code -- docs/ README.md data/factors/MANIFEST.json data/pcaf-parta/MANIFEST.json

  # The one status to require before merging to main.
  gate:
    runs-on: ubuntu-latest
    needs: [test, test-postgres, lint, typecheck, audit, ui, conformance-evidence, docs]
    steps:
      - run: echo "every check passed"
