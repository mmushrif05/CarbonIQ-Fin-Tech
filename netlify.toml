# CarbonIQ FinTech — Netlify Configuration

[build]
  # build:info stamps COMMIT_REF into build-info.json. COMMIT_REF exists only
  # during the build, not in the function's runtime environment, so without
  # this step /health cannot report the running commit — which is the one
  # question it exists to answer.
  command = "npm install && npm run build:info && npm run build:ui && node scripts/db-migrate.js up --if-configured"
  # The built frontend (scripts/build-ui.js): ui/ minified, paths preserved.
  # esbuild is a runtime dependency, not a dev one: NODE_ENV=production below
  # makes `npm install` omit devDependencies, and the build step needs it.
  publish = "dist/ui"
  functions = "netlify/functions"

[functions]
  node_bundler = "nft"
  # Keep firebase-admin as a real node_module rather than inlining it.
  # Its internal dynamic requires confuse nft's static tracer and can
  # cause "Cannot find module" crashes at function startup.
  external_node_modules = ["firebase-admin", "@firebase/app", "@google-cloud/storage"]

[functions."fintech-api"]
  # Increase timeout to 26s (Netlify Pro max) to give the Claude Haiku call
  # enough time even under cold-start conditions. Free plan is capped at 10s.
  timeout = 26
  # The report faces and the seed factor tables are read from disk at
  # runtime. nft traces require() calls, not fs.readFileSync of a joined
  # path, so without naming them here the bundle ships without them: the
  # factor store would fail and every report would silently fall back to the
  # built-in PDF fonts.
  included_files = [
    "assets/fonts/**",
    "data/factors/**",
    "data/gcf/**",
    "data/capital/**",
    "data/assurance.json",
    "build-info.json",
    # /health reports how many migrations are pending, which needs the files.
    "migrations/**",
  ]

# The job worker and the sweep render the same reports the API does, so
# they carry the same files (docs/JOBS.md).
[functions."jobs-background"]
  included_files = [
    "assets/fonts/**",
    "data/factors/**",
    "data/gcf/**",
    "data/capital/**",
    "data/assurance.json",
    "build-info.json",
    "migrations/**",
  ]

[functions."jobs-sweep"]
  included_files = [
    "assets/fonts/**",
    "data/factors/**",
    "data/gcf/**",
    "data/capital/**",
    "data/assurance.json",
    "build-info.json",
    "migrations/**",
  ]

# ── Caching ──────────────────────────────────────────────────────────────
#
# A deploy went out and the browser kept serving the previous build: the screen
# still showed the figure the change had replaced, which reads as "the fix did
# not work" rather than "the fix has not reached me". That is the same
# confusion /health reports the running commit to settle, one layer up.
#
# The application is a static shell that fetches its page fragments and its
# modules by path, with no hash in any filename, so there is nothing in a URL
# to tell a cache that a file has changed. Every one of them must therefore be
# revalidated on each load. `no-cache` does not mean "do not store" — the file
# is still kept and still answered with a 304 when it has not moved — it means
# "never serve it without asking", which is the guarantee a build needs when
# its filenames are stable.
#
# Fonts, images and the brand artwork are exempt: those are addressed by
# content that does not change under the same name, and they are the files
# worth caching.

# The Content Security Policy for what the CDN serves — the same string the
# function sends (src/platform/http/csp.js); tests/frontend.test.js holds
# the two to each other.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self';script-src 'self' 'unsafe-inline';style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;font-src 'self' https://fonts.gstatic.com data:;img-src 'self' data: blob:;connect-src 'self';frame-ancestors 'none';object-src 'none';base-uri 'self';form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/pages/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"

# Route API calls to the Express serverless function
# IMPORTANT: :splat captures everything after the prefix, so we must include
# the /v1/ segment in the destination so Express receives the correct path.
[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/fintech-api/v1/:splat"
  status = 200

[[redirects]]
  from = "/bank/*"
  to = "/.netlify/functions/fintech-api/v1/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/fintech-api/health"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/fintech-api/v1/:splat"
  status = 200

# SPA fallback — serve index.html for all unmatched frontend routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  NODE_ENV = "production"
  FINTECH_API_ENABLED = "true"
  FF_COVENANT_ENGINE = "true"
  FF_PORTFOLIO_AGGREGATION = "true"
  FF_TAXONOMY_CHECKER = "true"
  FF_CERTIFICATE_GENERATION = "false"
  FF_INSURANCE_OUTPUT = "false"
  PCAF_VERSION = "3.0"
  PCAF_DEFAULT_ATTRIBUTION = "1.0"
  TAXONOMY_ASEAN_VERSION = "3"
  TAXONOMY_EU_VERSION = "2024"
  TAXONOMY_HK_VERSION = "2024"
  WEBHOOK_TIMEOUT_MS = "5000"
  WEBHOOK_MAX_RETRIES = "3"
  LOG_LEVEL = "info"
  LOG_VERBOSE = "false"
  # Error reports are tagged with this; the DSN itself is set in the site's
  # environment variables, never here.
  SENTRY_ENVIRONMENT = "production"

# A deploy preview must behave like production, or it cannot be used to
# review a change. Previously only NODE_ENV and FINTECH_API_ENABLED were set
# here, so every FF_ flag fell back to unset — which reads as false — and
# Portfolio, Taxonomy and Covenant answered 503 FEATURE_DISABLED on every
# preview while working fine in production. A reviewer had no way to tell
# that from a broken branch.
# Staging: a branch deploy of `staging`, production-shaped (docs/ENVIRONMENTS.md).
# Its own DATABASE_URL, UI_API_KEY and SENTRY_DSN are set on the branch
# context in the site's environment variables, never here.
[context.staging.environment]
  NODE_ENV = "staging"
  SENTRY_ENVIRONMENT = "staging"
  LOG_LEVEL = "debug"
  FINTECH_API_ENABLED = "true"
  FF_COVENANT_ENGINE = "true"
  FF_PORTFOLIO_AGGREGATION = "true"
  FF_TAXONOMY_CHECKER = "true"
  FF_CERTIFICATE_GENERATION = "false"
  FF_INSURANCE_OUTPUT = "false"

[context.deploy-preview.environment]
  NODE_ENV = "staging"
  SENTRY_ENVIRONMENT = "deploy-preview"
  FINTECH_API_ENABLED = "true"
  FF_COVENANT_ENGINE = "true"
  FF_PORTFOLIO_AGGREGATION = "true"
  FF_TAXONOMY_CHECKER = "true"
  FF_CERTIFICATE_GENERATION = "false"
  FF_INSURANCE_OUTPUT = "false"
